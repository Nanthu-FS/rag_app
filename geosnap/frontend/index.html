<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>GeoSnap · Image Location Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<!-- Globe.gl WebGL globe (vendored locally) -->
<script src="/globe.gl.min.js"></script>
<link rel="stylesheet" href="/styles.css"/>
</head>
<body>
<div class="shell">

  <!-- ── Left rail ───────────────────────────────────── -->
  <nav class="rail">
    <div class="rail-logo">
      <div class="logo-ring"></div>
    </div>
    <button class="rail-btn active" title="Globe" data-tip="Globe">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a15 15 0 0 1 0 18M3 12h18"/><path d="M4.2 7.5h15.6M4.2 16.5h15.6"/></svg>
    </button>
    <button class="rail-btn" title="History" data-tip="History" id="nav-history">
      <svg viewBox="0 0 24 24"><path d="M12 8v4l2.5 2.5M3 12a9 9 0 1 0 .5-3"/><path d="M3 4v5h5"/></svg>
    </button>
    <button class="rail-btn" title="Upload" data-tip="Upload" id="nav-upload">
      <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
    </button>
    <div class="rail-spacer"></div>
    <button class="rail-btn" title="Settings" data-tip="Settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <div class="rail-avatar">N</div>
  </nav>

  <!-- ── Main area ────────────────────────────────────── -->
  <main class="main">

    <!-- top bar -->
    <header class="topbar">
      <div>
        <h1 class="page-title">GeoSnap</h1>
        <p class="page-sub">Image Location Intelligence</p>
      </div>
      <div class="topbar-right">
        <div class="model-badge" id="model-badge">
          <span class="dot"></span>
          <span id="model-name">connecting…</span>
        </div>
        <label class="upload-btn" id="upload-label">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
          Analyze Image
          <input type="file" id="file-input" accept="image/*" hidden/>
        </label>
      </div>
    </header>

    <!-- stats row -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-icon" style="--c:#7c3aed">
          <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="9"/><path d="M12 3a15 15 0 0 1 0 18M3 12h18"/></svg>
        </div>
        <div class="stat-body">
          <div class="stat-label">Total Analyzed</div>
          <div class="stat-val" id="stat-total">0</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="--c:#2563eb">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        </div>
        <div class="stat-body">
          <div class="stat-label">GPS Confirmed</div>
          <div class="stat-val" id="stat-gps">0</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="--c:#059669">
          <svg viewBox="0 0 24 24" width="18" height="18"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>
        </div>
        <div class="stat-body">
          <div class="stat-label">AI Predicted</div>
          <div class="stat-val" id="stat-vision">0</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="--c:#d97706">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 7l9-4 9 4v13l-9 4-9-4z"/><path d="M12 3v18M3 7l9 4 9-4"/></svg>
        </div>
        <div class="stat-body">
          <div class="stat-label">Countries</div>
          <div class="stat-val" id="stat-countries">0</div>
        </div>
      </div>
    </div>

    <!-- content grid: result card left + globe right -->
    <div class="content-grid">

      <!-- left: result card + history list -->
      <aside class="left-panel">
        <!-- result card (shown after analysis) -->
        <div class="result-card" id="result-card" hidden>
          <div class="result-head">
            <div class="result-pin" id="result-pin">
              <svg viewBox="0 0 24 24" width="18" height="18"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            </div>
            <div>
              <div class="result-place" id="result-place">—</div>
              <div class="result-coords" id="result-coords">—</div>
            </div>
            <span class="conf-badge" id="conf-badge">—</span>
          </div>
          <div class="result-source" id="result-source"></div>
          <div class="clues-list" id="clues-list"></div>
          <div class="reasoning-box" id="reasoning-box" hidden></div>
          <div class="exif-grid" id="exif-grid"></div>
        </div>

        <!-- analyzing overlay -->
        <div class="analyzing-card" id="analyzing-card" hidden>
          <div class="spinner-ring"></div>
          <div class="analyzing-text" id="analyzing-text">Preparing…</div>
          <div class="analyzing-sub">Powered by llama3.2-vision</div>
        </div>

        <!-- history -->
        <div class="history-section">
          <div class="section-label">Recent <button class="clear-btn" id="clear-btn">Clear</button></div>
          <div class="history-list" id="history-list">
            <div class="history-empty">No images analyzed yet.<br>Upload one to begin.</div>
          </div>
        </div>
      </aside>

      <!-- right: 3D globe -->
      <div class="globe-wrap">
        <div id="globe-el"></div>
        <div class="globe-hint" id="globe-hint">Drag to rotate · Scroll to zoom</div>
      </div>
    </div>
  </main>
</div>

<!-- drop overlay -->
<div class="drop-overlay" id="drop-overlay">
  <div class="drop-content">
    <svg viewBox="0 0 24 24" width="48" height="48"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
    <span>Drop image to analyze</span>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
