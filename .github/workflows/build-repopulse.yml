name: Build RepoPulse.exe

on:
  workflow_dispatch:
  push:
    paths:
      - "git_dashboard/**"
      - ".github/workflows/build-repopulse.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: git_dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: python -m PyInstaller --noconfirm --windowed --onefile --name RepoPulse --add-data "ui;ui" app.py

      - name: Smoke test bundle contents
        shell: pwsh
        run: |
          if (-not (Test-Path dist/RepoPulse.exe)) { throw "exe missing" }
          "{0:N1} MB" -f ((Get-Item dist/RepoPulse.exe).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: RepoPulse
          path: git_dashboard/dist/RepoPulse.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: repopulse-latest
          name: RepoPulse (latest build)
          body: |
            Windows build of RepoPulse, the Git repo dashboard.
            Download `RepoPulse.exe` and run it. Requires git on PATH.
            Built from ${{ github.sha }}.
          prerelease: true
          make_latest: false
          files: git_dashboard/dist/RepoPulse.exe
