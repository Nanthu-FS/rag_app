<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Intelligence</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%231b6f87' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%2338e1ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="reactor" id="reactor"><span></span></div>
      <div class="title">
        <h1>PERSONAL INTELLIGENCE</h1>
        <p id="status" class="status">Initializing…</p>
      </div>
      <button id="voiceToggle" class="voice-pref" title="Toggle spoken replies">🔊 Voice on</button>
    </header>

    <main id="log" class="log">
      <div class="msg personal_intelligence">
        <div class="bubble">Good day, sir. All systems online. How may I assist?</div>
      </div>
    </main>

    <div id="agentStrip" class="agent-strip"></div>

    <footer class="composer">
      <button id="micBtn" class="mic" title="Hold to speak (push-to-talk)">🎙️</button>
      <input id="input" class="input" type="text" placeholder="Ask Personal Intelligence anything…" autocomplete="off" />
      <button id="sendBtn" class="send">Send</button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
